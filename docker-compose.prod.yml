services:
  api:
    build: .
    command: sh -c "RUN_EMBEDDED_SCHEDULER=false uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/nasdaq_monitor.db
      - RUN_EMBEDDED_SCHEDULER=false
    restart: unless-stopped

  worker:
    build: .
    command: python -m app.worker
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/nasdaq_monitor.db
      - RUN_EMBEDDED_SCHEDULER=false
    depends_on:
      - api
    restart: unless-stopped

  paper-simulator:
    build: .
    command: python -m app.paper_simulator
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/nasdaq_monitor.db
      - PAPER_SIM_INTERVAL_SECONDS=300
    depends_on:
      - api
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
